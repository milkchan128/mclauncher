# Custom Language File for Launcher Customizer

[ejs.app]
title = "mlkc Client"

[ejs.landing]
launchButton = "게임 시작"
launchButtonHint = "필요한 모드를 자동으로 설치한 뒤 게임을 시작합니다."
mediaHomeURL = "https://www.curseforge.com/minecraft/modpacks/society-sunlit-valley"
mediaLinkURL = "#"
mediaMapURL = ""
mediaGitHubURL = "https://github.com/milkchan128/mclauncher"
mediaXURL = "#"
mediaInstagramURL = "#"
mediaYouTubeURL = "#"
mediaDiscordURL = ""

[ejs.settings]
launcherUpdatesHeaderDesc = "새 버전을 자동으로 확인하고 다운로드합니다. 다운로드가 끝나면 재시작하거나 앱을 종료할 때 설치합니다."
sourceGithubLink = "https://github.com/milkchan128/mclauncher"
supportLink = "https://github.com/milkchan128/mclauncher/issues"

[ejs.welcome]
welcomeHeader = "mlkc Client"
welcomeDescription = "밀튜디오 클라이언트에 오신 것을 환영합니다. 마인크래프트 계정을 연결하면 서버 접속에 필요한 파일을 자동으로 준비할 수 있습니다."
welcomeDescCTA = "mc.mlkc.kr에서 함께 시작하세요."

[js.settings.updates]
manualUpdateTitle = "설치 버전에서 자동 업데이트를 사용할 수 있습니다"
manualUpdateButton = "설치한 클라이언트에서 확인하세요"
checkFailedTitle = "업데이트 정보를 확인할 수 없습니다. 잠시 후 다시 시도해 주세요."

[ejs.loginOptions]
loginOptionsTitle = "Microsoft 계정으로 시작하세요"

[js.uicore.autoUpdate]
downloadingProgress = "업데이트 다운로드 중 {percent}%"
