appId: 'kr.mlkc.modlauncher'
productName: 'mlkc Client'
artifactName: 'mlkc-Client-setup-${version}.${ext}'
publish: null

copyright: 'Copyright © 2018-2026 Daniel Scalzi, Copyright © 2024 peunsu'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs,AGENTS.md,CLAUDE.md,mlkclogo.png,mlkc-logo-discord.gif,tests}'
  - '!app/assets/images/backgrounds/[0-9].png'

extraResources:
  - 'libraries'

# Windows Configuration
win:
  executableName: 'mlkc-Client'
  icon: 'build/icon.ico'
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'mlkc-Client-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Daniel Scalzi, peunsu'
  vendor: 'Daniel Scalzi, peunsu'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'
